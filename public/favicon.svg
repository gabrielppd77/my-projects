    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#bg)"/>
  <rect x="4" y="4" width="56" height="56" rx="10" fill="none" stroke="url(#ring)" stroke-width="3" filter="url(#glow)"/>
  <g fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M28 20 H17 V44 H28 V33 H23" stroke="#00f0ff"/>
